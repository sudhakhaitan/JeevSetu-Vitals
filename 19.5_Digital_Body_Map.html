<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>19.5 Digital Body Map</title><style>body{font-family:Arial;margin:20px;max-width:800px}select,input,textarea{width:100%;padding:9px;margin:6px 0 14px}button{padding:10px 16px}</style></head><body>
<h1>19.5 — DIGITAL BODY-MAP SYSTEM</h1>
<p><b>Core reusable JeevSetu feature.</b></p>
<label>Body region<select><option>Head / neck</option><option>Chest</option><option>Abdomen</option><option>Upper limb</option><option>Lower limb</option><option>Musculoskeletal regions</option><option>Skin</option><option>Breast</option><option>Feet</option><option>Neurological distribution</option></select></label>
<label>Finding<select><option>Pain</option><option>Tenderness</option><option>Swelling</option><option>Mass</option><option>Skin lesion</option><option>Joint abnormality</option><option>Neurological deficit</option><option>Sensory loss</option><option>Weakness</option><option>Oedema</option><option>Other localized finding</option></select></label>
<label>Laterality<select><option>Not applicable</option><option>Right</option><option>Left</option><option>Bilateral</option></select></label>
<label>Anatomical location<input></label>
<label>Clinical description<textarea></textarea></label>
<button>Add finding</button>
<h2>Data retained for each finding</h2><p>Visual location + anatomical terminology + laterality + finding + date + clinician.</p>
</body></html>
