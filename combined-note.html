<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JeevSetu — Combined Clinical Note</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:18px;color:#17202a;line-height:1.35}.toolbar{margin-bottom:18px}.toolbar button,.toolbar a{display:inline-block;padding:10px 14px;margin:0 8px 8px 0;border:0;border-radius:6px;background:#1f5f8b;color:#fff;text-decoration:none;cursor:pointer;font-weight:700}.note{border:1px solid #cbd2d8;border-radius:8px;padding:14px;margin:14px 0}.missing{padding:12px;background:#fff6df;border:1px solid #d7b45b;border-radius:6px}.note h1{font-size:17pt;margin:0 0 8pt;border-bottom:1px solid #555;padding-bottom:5pt}.note h2{font-size:12.5pt;margin:9pt 0 5pt}.note h3{font-size:10.5pt;margin:7pt 0 4pt}.note p,.note div{font-size:9.5pt;line-height:1.25;margin:3pt 0}.note hr{margin:6pt 0}
@page{size:A4 portrait;margin:10mm}@media print{body{max-width:none;margin:0;padding:0}.toolbar,.missing{display:none!important}.note{border:0;border-radius:0;padding:0;margin:0 0 12pt;break-inside:auto;page-break-inside:auto}.note + .note{break-before:page;page-break-before:always}}
</style></head><body><div class="toolbar"><a href="index.html">Back to JeevSetu Vitals 2</a><button onclick="loadNotes()">Refresh Notes</button><button onclick="window.print()">Print / Save Combined PDF</button></div><h1>JeevSetu — Combined Clinical Note</h1><p>Combined report: Endocrine / Metabolic followed by Urinary examination.</p><div id="missing" class="missing" style="display:none"></div><section id="endo" class="note"></section><section id="urinary" class="note"></section>
<script>
function loadNotes(){const e=localStorage.getItem('jeevsetu_endocrine_note');const u=localStorage.getItem('jeevsetu_urinary_note');const em=document.getElementById('endo'),um=document.getElementById('urinary'),m=document.getElementById('missing');em.innerHTML=e||'';um.innerHTML=u||'';em.style.display=e?'block':'none';um.style.display=u?'block':'none';let missing=[];if(!e)missing.push('Endocrine clinical note not found. Open Endocrine Examination, generate its clinical summary, then return here.');if(!u)missing.push('Urinary clinical note not found. Open Urinary Examination, generate its clinical note, then return here.');m.textContent=missing.join(' ');m.style.display=missing.length?'block':'none';if(!e&&!u){em.style.display='none';um.style.display='none'}}loadNotes();
</script></body></html>
