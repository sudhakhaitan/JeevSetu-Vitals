<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JeevSetu — Neurological Assessment</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#17212b}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:12px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #0001}h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px;border-bottom:2px solid #ddd;padding-bottom:8px}.grid{display:grid;grid-template-columns:1fr 180px;gap:10px 18px;align-items:center}.row{padding:9px 0;border-bottom:1px solid #eee}select{width:100%;padding:9px;border:1px solid #bbb;border-radius:7px;background:white}button{padding:11px 18px;border:0;border-radius:8px;background:#1769aa;color:#fff;font-size:15px;margin:5px;cursor:pointer}.secondary{background:#555}.note{display:none}.note h1{text-align:center;font-size:23px}.note h2{margin-top:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #ccc;padding:9px;text-align:left}.table th{background:#f0f2f4}.abnormal{font-weight:bold}.footer{margin-top:20px;font-size:12px;color:#666}@media(max-width:650px){.grid{grid-template-columns:1fr 145px}}@media print{body{background:white}.wrap{padding:0}.form{display:none!important}.note{display:block!important}.card{box-shadow:none;padding:0}.note h1{margin-top:0}.no-print{display:none!important}}
</style></head><body><div class="wrap">
<div class="form">
<div class="card"><h1>JeevSetu — Neurological Assessment</h1><div>Routine neurological screen and clinical examination.</div></div>
<div class="card"><h2>1. Neurological Symptoms — Routine Screen</h2><div id="symptoms"></div></div>
<div class="card"><h2>2. Neurological Examination</h2><div id="exam"></div></div>
<div class="card"><button onclick="generateNote()">Generate Clinical Note</button><button class="secondary" onclick="window.print()">Print Clinical Note</button><button class="secondary" onclick="resetForm()">Reset</button></div></div>
<div class="note" id="note"></div></div>
<script>
const symptoms=['Headache','Dizziness / Vertigo','Fainting / Near-fainting','Weakness','Numbness / Tingling','Speech / Language Difficulty','Visual Neurological Symptoms','Balance / Walking Difficulty','Falls','Memory / Cognitive Change','Tremor / Abnormal Movement','Seizure / Loss of Consciousness'];
const exams=['Level of Consciousness','Orientation','Speech','Motor Power — Upper Limbs','Motor Power — Lower Limbs','Muscle Tone','Sensation — Screening','Reflexes','Coordination','Gait','Balance','Tremor / Abnormal Movement','Falls / Functional Neurological Concern'];
const normalSym='Not present'; const normalExam='Normal';
function makeRows(id,arr,type){const box=document.getElementById(id);arr.forEach((x,i)=>{const r=document.createElement('div');r.className='grid row';let opts=type==='sym'?[['Not present','Not present'],['Present','Present']]:x==='Gait'?[['Normal','Normal'],['Abnormal','Abnormal']]:x==='Tremor / Abnormal Movement'?[['Absent','Absent'],['Present','Present']]:x==='Falls / Functional Neurological Concern'?[['None identified','None identified'],['Present','Present']]:[['Normal','Normal'],['Abnormal','Abnormal']];r.innerHTML='<div>'+x+'</div><select id="'+id+i+'">'+opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</select>';box.appendChild(r)})}
makeRows('symptoms',symptoms,'sym');makeRows('exam',exams,'exam');
function val(prefix,i){return document.getElementById(prefix+i).value}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function generateNote(){let sh='<table class="table"><tr><th>Symptom</th><th>Finding</th></tr>';symptoms.forEach((x,i)=>{let v=val('symptoms',i);sh+='<tr><td>'+x+'</td><td class="'+(v==='Present'?'abnormal':'')+'">'+v+'</td></tr>'});sh+='</table>';let eh='<table class="table"><tr><th>Examination</th><th>Finding</th></tr>';exams.forEach((x,i)=>{let v=val('exam',i);eh+='<tr><td>'+x+'</td><td class="'+(v==='Abnormal'||v==='Present'?'abnormal':'')+'">'+v+'</td></tr>'});eh+='</table>';document.getElementById('note').innerHTML='<div class="card"><h1>NEUROLOGICAL ASSESSMENT</h1><h2>1. Neurological Symptoms — Routine Screen</h2>'+sh+'<h2>2. Neurological Examination</h2>'+eh+'<h2>3. Cranial Nerves</h2><p>Cranial nerve examination is not included in this module. Eye and ENT findings are documented in their respective examination modules.</p><div class="footer">JeevSetu Clinical Assessment</div></div>';document.querySelector('.note').scrollIntoView({behavior:'smooth'})}
function resetForm(){document.querySelectorAll('select').forEach((s,i)=>{s.selectedIndex=0});document.getElementById('note').innerHTML=''}
generateNote();
</script></body></html>
