<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JeevSetu — Musculoskeletal</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:18px;background:#f5f6f7;color:#222}
h1{font-size:24px} h2{font-size:19px;border-bottom:2px solid #555;padding-bottom:5px;margin-top:25px}
h3{font-size:16px;margin-top:18px}
.card{background:#fff;padding:16px;margin:12px 0;border-radius:8px;box-shadow:0 1px 4px #ccc}
label{display:block;margin:9px 0 4px;font-weight:600}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:5px;font-size:15px}
button{padding:10px 16px;margin:6px 4px 6px 0;border:0;border-radius:5px;background:#333;color:white}
button.secondary{background:#777}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:white;padding:22px;line-height:1.45}
.note table{width:100%;border-collapse:collapse;margin:8px 0 18px}
.note th,.note td{border:1px solid #ccc;padding:7px;text-align:left;vertical-align:top}
.note th{background:#eee}
.abnormal{font-weight:700}
.alert{border:2px solid #900;background:#fff0f0;padding:10px;font-weight:700}
.hidden{display:none}
@media print{
 body{background:white;max-width:none;padding:0}
 .form,.controls{display:none!important}
 .note{box-shadow:none;padding:0}
}
</style>
</head>
<body>
<div class="form">
<h1>JeevSetu — 18.7 / 19.10 Musculoskeletal</h1>

<div class="card">
<h2>18.7 — MUSCULOSKELETAL</h2>
<h3>EVERY PATIENT</h3>

<label>Joint symptoms</label>
<select id="joint"><option value="">Select</option><option>No</option><option>Yes</option></select>

<label>Back / neck pain or stiffness</label>
<select id="back"><option value="">Select</option><option>No</option><option>Yes</option></select>

<label>Difficulty with chair rising, stairs or normal activities</label>
<select id="strength"><option value="">Select</option><option>No</option><option>Yes</option></select>

<label>Mobility difficulty or reduced mobility</label>
<select id="mobility"><option value="">Select</option><option>No</option><option>Yes</option></select>

<h3>Functional / Senior Pathway</h3>
<label>Need for hand support</label>
<select id="hand"><option value="">Select</option><option>No</option><option>Yes</option></select>
<label>Difficulty climbing stairs</label>
<select id="upstairs"><option value="">Select</option><option>No</option><option>Yes</option></select>
<label>Difficulty descending stairs</label>
<select id="downstairs"><option value="">Select</option><option>No</option><option>Yes</option></select>
<label>Leg weakness</label>
<select id="legweak"><option value="">Select</option><option>No</option><option>Yes</option></select>
<label>Reduced walking speed</label>
<select id="slowwalk"><option value="">Select</option><option>No</option><option>Yes</option></select>

<h3>Bone Health — Where Appropriate</h3>
<label>Previous osteoporosis</label>
<select id="osteoporosis"><option value="">Select</option><option>No</option><option>Yes</option></select>
<label>Fragility fracture</label>
<select id="fracturehistory"><option value="">Select</option><option>No</option><option>Yes</option></select>
<label>Long-term steroid exposure</label>
<select id="steroids"><option value="">Select</option><option>No</option><option>Yes</option></select>

<h3>19.10 — MUSCULOSKELETAL EXAMINATION</h3>
<h3>General</h3>
<label>Posture</label><input id="posture" placeholder="Finding">
<label>Gait</label><input id="gait" placeholder="Finding">
<label>Deformity</label><input id="deformity" placeholder="Finding">
<label>Muscle wasting</label><input id="wasting" placeholder="Finding">
<label>Joint swelling</label><input id="swelling" placeholder="Finding">
<label>Asymmetry</label><input id="asymmetry" placeholder="Finding">

<h3>Joints — Relevant Joint Findings</h3>
<label>Joint / region</label><input id="jointregion" placeholder="e.g. Right knee">
<label>Inspection</label><input id="inspection" placeholder="Finding">
<label>Swelling</label><input id="jswelling" placeholder="Finding">
<label>Warmth</label><input id="warmth" placeholder="Finding">
<label>Tenderness</label><input id="tenderness" placeholder="Finding">
<label>Deformity</label><input id="jdeformity" placeholder="Finding">
<label>Range of motion</label><input id="rom" placeholder="Finding">
<label>Crepitus</label><input id="crepitus" placeholder="Finding">
<label>Stability</label><input id="stability" placeholder="Where appropriate">
<label>Digital body-map marking</label><input id="bodymap" placeholder="Marked region(s)">

<h3>Spine</h3>
<label>Region</label><select id="spineregion"><option value="">Select</option><option>Cervical</option><option>Thoracic</option><option>Lumbar</option><option>Multiple regions</option></select>
<label>Tenderness</label><input id="spinetender" placeholder="Finding">
<label>Range of movement</label><input id="spinerom" placeholder="Finding">
<label>Deformity</label><input id="spinedef" placeholder="Finding">
<label>Muscle spasm</label><input id="spasm" placeholder="Finding">
<label>Associated neurological findings</label><input id="neuro" placeholder="Finding">

<h3>Muscle Strength</h3>
<label>Right</label><input id="strengthR" placeholder="Standardized grade where appropriate">
<label>Left</label><input id="strengthL" placeholder="Standardized grade where appropriate">

<h3>Senior Functional Assessment</h3>
<label>Sit-to-stand</label><input id="sitstand" placeholder="Finding">
<label>Walking</label><input id="walk" placeholder="Finding">
<label>Walking aid</label><input id="aid" placeholder="Finding">
<label>Stair climbing</label><input id="stairs" placeholder="Finding">
<label>Balance</label><input id="balance" placeholder="Finding">
<label>Assistance required</label><input id="assist" placeholder="Finding">

<h3>Pain Map</h3>
<label>Location</label><input id="painloc">
<label>Laterality</label><input id="laterality">
<label>Radiation</label><input id="radiation">
<label>Joint / muscle / spine region</label><input id="painregion">

<h3>Red Flags</h3>
<label>Sudden inability to walk</label><select id="rfwalk"><option>No</option><option>Yes</option></select>
<label>Suspected fracture</label><select id="rffracture"><option>No</option><option>Yes</option></select>
<label>Severe joint swelling with fever</label><select id="rfswelling"><option>No</option><option>Yes</option></select>
<label>Severe back pain with new bladder/bowel dysfunction or saddle-area sensory symptoms</label><select id="rfback"><option>No</option><option>Yes</option></select>
<label>New neurological weakness</label><select id="rfneuro"><option>No</option><option>Yes</option></select>

<div class="controls">
<button onclick="generate()">Generate Clinical Note</button>
<button class="secondary" onclick="window.print()">Print Clinical Note</button>
</div>
</div>
</div>

<div id="note" class="note hidden"></div>

<script>
const v=id=>document.getElementById(id)?.value||"Not recorded";
const row=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
function generate(){
 let alerts=[];
 [["Sudden inability to walk","rfwalk"],["Suspected fracture","rffracture"],["Severe joint swelling with fever","rfswelling"],["Severe back pain with new bladder/bowel dysfunction or saddle-area sensory symptoms","rfback"],["New neurological weakness","rfneuro"]].forEach(x=>{if(v(x[1])==="Yes")alerts.push(x[0])});
 const abnormalIds=["joint","back","strength","mobility","hand","upstairs","downstairs","legweak","slowwalk"];
 let symptomRows=abnormalIds.map(id=>[id,v(id)]).map(x=>row(x[0],x[1])).join("");
 document.getElementById("note").innerHTML=`
 <h1>JeevSetu — MUSCULOSKELETAL CLINICAL NOTE</h1>
 <h2>18.7 — Musculoskeletal Symptoms</h2>
 <table><tr><th>Screening item</th><th>Finding</th></tr>
 ${row("Joint symptoms",v("joint"))}${row("Back / neck pain or stiffness",v("back"))}
 ${row("Functional strength",v("strength"))}${row("Mobility",v("mobility"))}</table>
 <h3>Functional / Senior Pathway</h3>
 <table><tr><th>Assessment</th><th>Finding</th></tr>
 ${row("Need for hand support",v("hand"))}${row("Difficulty climbing stairs",v("upstairs"))}
 ${row("Difficulty descending stairs",v("downstairs"))}${row("Leg weakness",v("legweak"))}${row("Reduced walking speed",v("slowwalk"))}</table>
 <h3>Bone Health — Where Appropriate</h3>
 <table><tr><th>Risk factor</th><th>Finding</th></tr>
 ${row("Previous osteoporosis",v("osteoporosis"))}${row("Fragility fracture",v("fracturehistory"))}${row("Long-term steroid exposure",v("steroids"))}</table>
 <h2>19.10 — Musculoskeletal Examination</h2>
 <h3>General</h3><table><tr><th>Examination</th><th>Finding</th></tr>
 ${row("Posture",v("posture"))}${row("Gait",v("gait"))}${row("Deformity",v("deformity"))}${row("Muscle wasting",v("wasting"))}${row("Joint swelling",v("swelling"))}${row("Asymmetry",v("asymmetry"))}</table>
 <h3>Joints</h3><table><tr><th>Finding</th><th>Result</th></tr>
 ${row("Joint / region",v("jointregion"))}${row("Inspection",v("inspection"))}${row("Swelling",v("jswelling"))}${row("Warmth",v("warmth"))}${row("Tenderness",v("tenderness"))}${row("Deformity",v("jdeformity"))}${row("Range of motion",v("rom"))}${row("Crepitus",v("crepitus"))}${row("Stability",v("stability"))}${row("Digital body-map marking",v("bodymap"))}</table>
 <h3>Spine</h3><table><tr><th>Finding</th><th>Result</th></tr>
 ${row("Region",v("spineregion"))}${row("Tenderness",v("spinetender"))}${row("Range of movement",v("spinerom"))}${row("Deformity",v("spinedef"))}${row("Muscle spasm",v("spasm"))}${row("Associated neurological findings",v("neuro"))}</table>
 <h3>Muscle Strength</h3><table><tr><th>Side</th><th>Finding</th></tr>${row("Right",v("strengthR"))}${row("Left",v("strengthL"))}</table>
 <h3>Senior Functional Assessment</h3><table><tr><th>Assessment</th><th>Finding</th></tr>
 ${row("Sit-to-stand",v("sitstand"))}${row("Walking",v("walk"))}${row("Walking aid",v("aid"))}${row("Stair climbing",v("stairs"))}${row("Balance",v("balance"))}${row("Assistance required",v("assist"))}</table>
 <h3>Pain Map</h3><table><tr><th>Item</th><th>Finding</th></tr>${row("Location",v("painloc"))}${row("Laterality",v("laterality"))}${row("Radiation",v("radiation"))}${row("Joint / muscle / spine region",v("painregion"))}</table>
 ${alerts.length?`<div class="alert">CLINICIAN ALERT — ${alerts.join("; ")}</div>`:"<p><b>Red flags:</b> None identified.</p>"}
 <p><b>Note:</b> Fall information is taken from Section 9; it is not duplicated here.</p>`;
 document.getElementById("note").classList.remove("hidden");
 document.querySelector(".form").scrollIntoView({behavior:"smooth"});
}
</script>
</body></html>
